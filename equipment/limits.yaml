# 드라이버가 따로 지키는 2차 상한 (모든 값은 실습용 가상값)
# 장치 상한(kimm_sim.yaml)보다 좁게 잡는다. 이 범위를 넘는 명령은 장치에 보내기 전에 거부된다.
# 실제 장비에 적용할 때는 장비 매뉴얼과 시험 절차서의 값으로 바꾸고, 바꾼 사람과 날짜를 남긴다.

shaker:
  level_max: 0.30          # 가진 레벨 상한 (장치 상한 0.50)
  freq_min_hz: 10.0        # 가진 주파수 하한 (장치 범위 5~2000)
  freq_max_hz: 500.0       # 가진 주파수 상한

table:                     # 축별 변위 상한, ±mm (장치 상한 X·Y ±50, Z ±25)
  x_mm: 30.0
  y_mm: 30.0
  z_mm: 15.0

monitor:
  peak_alarm_g: 0.8        # 측정 피크가 이 값을 넘으면 이상 상황으로 보고 비상 정지
